<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Admin upload</title>
  <style>
    body { font-family: sans-serif; padding: 30px; max-width: 600px; margin: auto; }
    input[type=file] { margin: 10px 0; }
    button { padding: 10px 18px; font-size: 16px; }
    #msg { font-size: 18px; margin-top: 15px; }
  </style>
</head>
<body>
  <h2>Admin: upload master data</h2>
  <p>CSV format: first column SKU, remaining columns are store names, cell = qty
  target (leave blank if that SKU doesn't go to that store). A SKU can have qty
  under more than one store.</p>
  <input type="file" id="fileInput" accept=".csv"/>
  <br/>
  <button onclick="upload()">Upload (replaces existing master data)</button>
  <p id="msg"></p>
  <p><a href="index.html">Back</a></p>

  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script>
    async function upload() {
      const file = document.getElementById('fileInput').files[0];
      const msg = document.getElementById('msg');
      if (!file) return;
      msg.textContent = "Uploading...";

      const text = await file.text();
      const lines = text.split(/\r?\n/).filter(l => l.trim() !== "");
      if (lines.length < 2) { msg.textContent = "CSV looks empty."; return; }

      const header = lines[0].split(",");
      const storeNames = header.slice(1).map(s => s.trim());

      const masterData = {};
      for (let i = 1; i < lines.length; i++) {
        const cols = lines[i].split(",");
        const sku = cols[0].trim();
        if (!sku) continue;
        for (let j = 0; j < storeNames.length; j++) {
          const cell = (cols[j + 1] || "").trim();
          if (cell === "") continue;
          const qty = parseInt(cell, 10);
          if (!isNaN(qty) && qty > 0) {
            if (!masterData[sku]) masterData[sku] = {};
            masterData[sku][storeNames[j]] = qty;
          }
        }
      }

      try {
        await db.ref('master').set(masterData);
        await db.ref('storeOrder').set(storeNames);
        msg.textContent = "Uploaded successfully - " + Object.keys(masterData).length + " SKUs across " + storeNames.length + " stores (fill order: " + storeNames.join(" -> ") + ").";
      } catch (e) {
        msg.textContent = "Upload failed: " + e.message;
      }
    }
  </script>
</body>
</html>
