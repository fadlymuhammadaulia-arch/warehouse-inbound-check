<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Dashboard</title>
  <style>
    body { font-family: sans-serif; padding: 30px; max-width: 600px; margin: auto; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    td, th { border: 1px solid #999; padding: 6px 10px; text-align: left; }
  </style>
</head>
<body>
  <h2>Dashboard (live)</h2>
  <table>
    <tr><th>Checker</th><th>Store</th><th>Scans</th></tr>
    <tbody id="rows"><tr><td colspan="3">Loading...</td></tr></tbody>
  </table>
  <p><a href="index.html">Back</a></p>

  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script>
    // scans/{store}/{sku}/{pushId} = { checkerId, timestamp }
    db.ref('scans').on('value', snap => {
      const data = snap.val() || {};
      const counts = {}; // key: checkerId|store -> count

      Object.entries(data).forEach(([store, skus]) => {
        Object.values(skus || {}).forEach(scansForSku => {
          Object.values(scansForSku || {}).forEach(scan => {
            const key = scan.checkerId + "|" + store;
            counts[key] = (counts[key] || 0) + 1;
          });
        });
      });

      const rowsEl = document.getElementById('rows');
      const keys = Object.keys(counts).sort();
      if (keys.length === 0) {
        rowsEl.innerHTML = "<tr><td colspan='3'>No scans yet</td></tr>";
        return;
      }
      rowsEl.innerHTML = keys.map(k => {
        const [checkerId, store] = k.split("|");
        return "<tr><td>" + checkerId + "</td><td>" + store + "</td><td>" + counts[k] + "</td></tr>";
      }).join("");
    });
  </script>
</body>
</html>
