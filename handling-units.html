<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Handling Units</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 800px; margin: auto; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    td, th { border: 1px solid #999; padding: 6px 10px; text-align: left; font-size: 14px; }
    th { background: #2f5496; color: white; }
    .status-open { color: #b8860b; }
    .status-closed { color: green; font-weight: bold; }
    button { padding: 6px 12px; cursor: pointer; }
    @media print {
      @page { size: 7cm 3cm; margin: 0; }
      body * { visibility: hidden; }
      #printArea, #printArea * { visibility: visible; }
      #printArea { position: absolute; top: 0; left: 0; width: 100%; }
      .print-label {
        width: 7cm; height: 3cm; box-sizing: border-box; padding: 2mm;
        page-break-after: always; display: flex; flex-direction: column;
        align-items: center; justify-content: center; overflow: hidden;
      }
      .print-label img { max-width: 100%; max-height: 100%; object-fit: contain; }
      .lbl-price { font-size: 9pt; font-family: 'Times New Roman', serif; }
      .lbl-barcode { width: 90%; height: auto; }
      .lbl-sku, .lbl-name { font-size: 6.5pt; font-family: Calibri, sans-serif; text-align: center; }
      .lbl-missing { font-size: 8pt; text-align: center; color: #900; }
    }
  </style>
</head>
<body>
  <h2>Handling Units</h2>
  <p><a href="admin.html">Back to Dashboard</a></p>
  <table>
    <tr><th>HU Code</th><th>Checker</th><th>Store</th><th>Status</th><th>Action</th></tr>
    <tbody id="rows"><tr><td colspan="5">Memuat...</td></tr></tbody>
  </table>

  <div id="printArea" style="display:none;"></div>

  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script>
    let master = {};

    async function load() {
      const [huSnap, masterSnap] = await Promise.all([
        db.ref('handlingUnits').once('value'),
        db.ref('master').once('value')
      ]);
      master = masterSnap.val() || {};
      const hus = huSnap.val() || {};
      const rowsEl = document.getElementById('rows');
      const entries = Object.entries(hus).sort((a, b) => (b[1].createdAt || "").localeCompare(a[1].createdAt || ""));

      if (entries.length === 0) {
        rowsEl.innerHTML = "<tr><td colspan='5'>Belum ada handling unit.</td></tr>";
        return;
      }

      rowsEl.innerHTML = entries.map(([id, hu]) => {
        const statusClass = hu.status === 'closed' ? 'status-closed' : 'status-open';
        const statusLabel = hu.status === 'closed' ? 'Tertutup' : 'Terbuka';
        const action = hu.status === 'closed'
          ? "<button onclick=\"printLabel('" + id + "')\">Print Label</button>"
          : "-";
        return "<tr><td>" + hu.huCode + "</td><td>" + hu.checkerId + "</td><td>" + hu.store +
               "</td><td class='" + statusClass + "'>" + statusLabel + "</td><td>" + action + "</td></tr>";
      }).join("");
    }

    async function printLabel(huId) {
      const huSnap = await db.ref('handlingUnits/' + huId).once('value');
      const hu = huSnap.val();
      if (!hu) return;

      // Gather all scans belonging to this HU (scans are stored under
      // scans/{store}/{sku}/{pushId} with a huCode field on each entry).
      const scansSnap = await db.ref('scans/' + hu.store).once('value');
      const skuData = scansSnap.val() || {};
      const skuCounts = {};
      Object.entries(skuData).forEach(([sku, entries]) => {
        Object.values(entries || {}).forEach(scan => {
          if (scan.huCode === hu.huCode) {
            skuCounts[sku] = (skuCounts[sku] || 0) + 1;
          }
        });
      });

      const brandLabelsSnap = await db.ref('brandLabels').once('value');
      const brandLabels = brandLabelsSnap.val() || {};

      // Expand into one entry per physical unit, sorted/grouped by SKU
      // (e.g. SKU A, SKU A, SKU B, SKU B, SKU C...).
      const units = [];
      Object.keys(skuCounts).sort().forEach(sku => {
        const entry = master[sku] || {};
        for (let i = 0; i < skuCounts[sku]; i++) {
          units.push({ sku, name: entry.name || "", price: entry.price || "", brand: entry.brand || "" });
        }
      });

      // For each unit: Kemendagri label first, then the price/barcode
      // label - both sized 7cm x 3cm via the print CSS.
      let html = "";
      units.forEach((u, idx) => {
        const brandImg = brandLabels[u.brand];
        html += "<div class='print-label'>" +
          (brandImg
            ? "<img src='" + brandImg + "'/>"
            : "<div class='lbl-missing'>Gambar Kemendagri belum diupload untuk brand: " + (u.brand || "(kosong)") + "</div>") +
          "</div>";
        html += "<div class='print-label'>" +
          "<div class='lbl-price'>" + u.price + "</div>" +
          "<svg id='barcode-" + idx + "' class='lbl-barcode'></svg>" +
          "<div class='lbl-sku'>" + u.sku + "</div>" +
          "<div class='lbl-name'>" + u.name + "</div>" +
          "</div>";
      });

      const printArea = document.getElementById('printArea');
      printArea.innerHTML = html;
      printArea.style.display = 'block';

      units.forEach((u, idx) => {
        try {
          JsBarcode("#barcode-" + idx, u.sku, { format: "CODE128", displayValue: false, height: 30, margin: 0 });
        } catch (e) {
          console.error("Gagal membuat barcode untuk", u.sku, e);
        }
      });

      window.print();
      printArea.style.display = 'none';
    }

    load();
  </script>
</body>
</html>
