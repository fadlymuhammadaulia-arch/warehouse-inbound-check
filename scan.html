<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Scan</title>
  <style>
    body { font-family: sans-serif; padding: 30px; max-width: 600px; margin: auto; }
    input#skuInput { font-size: 24px; width: 100%; padding: 10px; box-sizing: border-box; }
    #msg { font-size: 20px; min-height: 50px; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    td, th { border: 1px solid #999; padding: 6px 10px; text-align: left; }
    .overflow { color: #b8860b; }
  </style>
</head>
<body>
  <div id="content">Loading...</div>

  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const checkerId = params.get('checker');
    const content = document.getElementById('content');
    let storeOrder = [];

    if (!checkerId) {
      content.innerHTML = "<p>No checker selected. <a href='login.html'>Go to login</a></p>";
    } else {
      init();
    }

    async function init() {
      const orderSnap = await db.ref('storeOrder').once('value');
      storeOrder = orderSnap.val() || [];

      content.innerHTML = `
        <h2>Checker ${checkerId}</h2>
        <input id="skuInput" autofocus placeholder="Scan SKU..."/>
        <p id="msg"></p>
        <table>
          <tr><th>SKU</th><th>Store</th><th>Time</th></tr>
          <tbody id="recentRows"></tbody>
        </table>
        <br/><a href="#" onclick="logout()">Logout</a>
      `;
      const input = document.getElementById('skuInput');
      const msg = document.getElementById('msg');
      input.focus();
      loadRecent();

      input.addEventListener('keypress', async (e) => {
        if (e.key !== 'Enter') return;
        const sku = input.value.trim();
        input.value = '';
        if (!sku) return;
        const result = await addScan(sku);
        if (result.success) {
          msg.className = result.overflow ? 'overflow' : '';
          msg.textContent = result.overflow
            ? (sku + " -> put in " + result.store + " (OVERFLOW - all targets already met)")
            : (sku + " -> put in " + result.store + " (" + result.remaining + " remaining there)");
          loadRecent();
        } else {
          msg.className = '';
          msg.style.color = 'red';
          msg.textContent = result.message;
        }
        input.focus();
      });
    }

    async function addScan(sku) {
      const masterSnap = await db.ref('master/' + sku).once('value');
      const masterEntry = masterSnap.val();
      if (!masterEntry) {
        return { success: false, message: "SKU not found in master data" };
      }

      // Only consider stores this SKU is actually assigned to, in priority order.
      const assignedStores = storeOrder.filter(s => s in masterEntry);
      if (assignedStores.length === 0) {
        return { success: false, message: "SKU not found in master data" };
      }

      // Check each assigned store's current fill level, in priority order.
      const counts = await Promise.all(assignedStores.map(store =>
        db.ref('scans/' + store + '/' + sku).once('value').then(snap => snap.numChildren())
      ));

      let targetStore = null;
      let remaining = 0;
      for (let i = 0; i < assignedStores.length; i++) {
        if (counts[i] < masterEntry[assignedStores[i]]) {
          targetStore = assignedStores[i];
          remaining = masterEntry[assignedStores[i]] - counts[i] - 1; // -1 for this scan
          break;
        }
      }

      let overflow = false;
      if (!targetStore) {
        // All targets met - overflow into the last assigned store.
        targetStore = assignedStores[assignedStores.length - 1];
        overflow = true;
      }

      const scanRef = db.ref('scans/' + targetStore + '/' + sku).push();
      await scanRef.set({ checkerId: checkerId, timestamp: new Date().toISOString() });
      await db.ref('recent/' + checkerId).push({ sku: sku, store: targetStore, timestamp: new Date().toISOString() });

      return { success: true, store: targetStore, remaining: remaining, overflow: overflow };
    }

    function loadRecent() {
      db.ref('recent/' + checkerId).limitToLast(10).once('value').then(snap => {
        const rows = [];
        snap.forEach(child => {
          const v = child.val();
          rows.unshift("<tr><td>" + v.sku + "</td><td>" + v.store + "</td><td>" + v.timestamp + "</td></tr>");
        });
        document.getElementById('recentRows').innerHTML = rows.join("");
      });
    }

    function logout() {
      db.ref('checkers/' + checkerId).set(false).then(() => {
        window.location.href = "login.html";
      });
    }
  </script>
</body>
</html>
